name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      - name: Statusline shell tests
        run: |
          brew install jq
          ./scripts/test-statusline.sh

      - name: Build app bundle
        run: ./scripts/build-app.sh
